0035 - errors.py:
  """Exception hierarchy for the AP-SRV-070 release orchestrator.\nEvery failure mode the release tooling can hit is one of these, so a caller\n(the CLI, or a future W6 automation) can distinguish "nothing to do"\nconditions from hard stops without parsing message text.\n"""

  class ReleaseError(RuntimeError):
    """Base class for every release-tooling failure."""

  class ManifestError(ReleaseError):
    """An RC manifest is missing, malformed, or fails a required identity check."""

  class StateError(ReleaseError):
    """The resumable release state is missing, corrupted, or an invalid transition\nwas requested (including a version mismatch against an existing state file)."""

  class OrderError(StateError):
    """A publication step was attempted out of the fixed W6 order (see\n``release_tooling.pipeline``), e.g. tagging before external verification."""

  class ConflictError(ReleaseError):
    """A pre-existing remote artifact does not match the expected release\nidentity. This is always a hard stop - never resolved by picking a new\nversion automatically."""

  class SecretDetectedError(ReleaseError):
    """A value that looks like a secret was about to be written to release\nstate, an RC manifest, or normal log output."""

  class VerificationUnavailableError(ReleaseError):
    """A read-only remote identity check could not be completed (e.g. no\nnetwork, tool missing) - distinct from :class:`ConflictError`, which\nmeans the check *did* complete and found a genuine mismatch. Real\npublication must fail closed on this too (it cannot tell match from\nconflict), but a dry-run may still report every other, independently\ncheckable step."""

