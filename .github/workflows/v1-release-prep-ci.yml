name: V1 release prep CI

on:
  push:
    branches:
      - 'review/v1-release-prep-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: V1 corrected release contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - name: Install contract-test tooling
        run: python -m pip install --upgrade 'pip<26' setuptools wheel build twine pytest PyYAML
      - name: Compile release helpers
        run: >-
          python -m compileall -q
          VoiceSTT/_release_variant.py
          VoiceSTT/transcription_engines/model_resolver.py
          tools/v1_kroko_release.py
          tools/v1_product_wheel.py
          tools/v1_release_manifest.py
          tools/v1_release_publish.py
          tools/v1_local_acceptance.py
          tools/v1_evidence_pack.py
      - name: Parse release workflows
        run: >-
          python -c "import pathlib,yaml;
          [yaml.safe_load(pathlib.Path(p).read_text(encoding='utf-8')) for p in
          ['.github/workflows/release-candidate.yml','.github/workflows/release-publish.yml','.github/workflows/v1-release-build-validation.yml']]"
      - name: Run corrected V1 contract tests
        run: >-
          python -m pytest -q
          tests/test_v1_model_resolution.py
          tests/test_v1_kroko_release.py
          tests/test_v1_product_wheel.py
          tests/test_v1_release_candidate_contract.py
          tests/test_v1_release_publish.py
          tests/test_v1_release_workflows.py

  source-identity:
    name: V1 source identity guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify review-branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '1.0.0'
          case "${GITHUB_REF_NAME}" in review/v1-release-prep-*) ;; *) exit 1;; esac
          test -z "$(git status --porcelain)"
          echo "commit=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse 'HEAD^{tree}')"
