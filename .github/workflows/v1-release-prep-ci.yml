name: V1 release prep CI

on:
  push:
    branches:
      - review/v1-release-prep-dirty
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    name: V1 package contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Install release-test tooling
        run: python -m pip install --upgrade "pip<26" setuptools wheel build twine pytest

      - name: Compile release helpers
        run: >-
          python -m compileall -q
          tools/check_v1_release_package.py
          tools/v1_kroko_release.py
          tools/v1_release_manifest.py

      - name: Build and inspect V1 wheel and sdist
        run: python tools/check_v1_release_package.py

      - name: Verify V1 release contracts
        run: >-
          python -m pytest -q
          tests/test_v1_kroko_release.py
          tests/test_v1_release_candidate_contract.py

  source-identity:
    name: V1 source identity guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify preparation branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.0"
          test "${GITHUB_REF_NAME}" = "review/v1-release-prep-dirty"
          test -z "$(git status --porcelain)"
          echo "commit=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse 'HEAD^{tree}')"
