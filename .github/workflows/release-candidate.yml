# AP-SRV-070 W5-R04: GitHub-native release-candidate build and qualification.
#
# Produces a COMPLETE release candidate from an exact source commit on clean,
# GitHub-hosted runners (Ubuntu 24.04 and Windows) - with no dependency on any
# operator machine, local artifact store, prebuilt wheel or local Docker credential:
#
#   exact commit/tree
#     -> Linux: Kroko Free + Pro native artifacts
#        -> voice-stt-server / voice-stt-server-pro Linux distribution wheels
#        -> Free + Pro production images -> private GHCR staging (digest-pinned)
#     -> Windows: Kroko Free + Pro native artifacts
#        -> voice-stt-server / voice-stt-server-pro Windows AMD64 distribution wheels
#     -> Candidate assembly & qualification:
#        -> combines all 4 wheels
#        -> canonical RC manifest + SHA-256 inventory
#        -> qualifies manifest (releaseReadiness: QUALIFIED)
#
# It publishes NOTHING public: no PyPI upload, no Docker Hub push, no public
# GHCR tag, no Git tag, no GitHub Release. The only remote write is to the
# PRIVATE staging packages, which exist so publication can later consume the
# exact qualified bytes instead of rebuilding them. Staging is never presented
# as a release.
#
# Dispatch-only on purpose: a normal push must never be able to start it.
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      qualification_context:
        description: "Free-text note recorded in the RC manifest"
        required: false
        default: "GitHub-native candidate build"

permissions:
  contents: read

concurrency:
  # One candidate per commit at a time. Two concurrent candidate builds for the
  # same source would race for the same staging tag and produce an ambiguity
  # that section 13 requires to fail closed.
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  KROKO_ARTIFACT_STORE: ${{ github.workspace }}/.kroko-artifacts
  KROKO_WORK_DIR: ${{ github.workspace }}/.kroko-work
  CANDIDATE_DIR: ${{ github.workspace }}/candidate

jobs:
  # --------------------------------------------------------------------
  # 1. Linux candidate: wheels (linux_x86_64) + production OCI images
  # --------------------------------------------------------------------
  candidate-linux:
    name: Build Linux candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only for the PRIVATE staging packages. No public package is written.
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
          python -m pip install --upgrade pip build wheel setuptools

      - name: Record the exact source identity
        id: source
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)" || { echo "checkout is not clean"; exit 1; }

      # ------------------------------------------------------------------
      # Kroko artifact reuse.
      # ------------------------------------------------------------------
      - name: Resolve authoritative Kroko fingerprints
        id: fingerprints
        run: |
          set -euo pipefail
          python tools/release_candidate.py --print-fingerprints \
            --kroko-artifact-store "$KROKO_ARTIFACT_STORE" \
            --kroko-work-dir "$KROKO_WORK_DIR" > fingerprints.json
          cat fingerprints.json
          echo "free=$(python -c 'import json;print(json.load(open("fingerprints.json"))["free"])')" >> "$GITHUB_OUTPUT"
          echo "pro=$(python -c 'import json;print(json.load(open("fingerprints.json"))["pro"])')" >> "$GITHUB_OUTPUT"

      - name: Restore Kroko Free artifact
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ env.KROKO_ARTIFACT_STORE }}/free
          key: kroko-free-${{ steps.fingerprints.outputs.free }}

      - name: Restore Kroko Pro artifact
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ env.KROKO_ARTIFACT_STORE }}/pro
          key: kroko-pro-${{ steps.fingerprints.outputs.pro }}

      - name: Log in to GHCR (private staging only)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux candidate
        run: |
          set -euo pipefail
          python tools/release_candidate.py \
            --out-dir "$CANDIDATE_DIR" \
            --platform linux \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --kroko-artifact-store "$KROKO_ARTIFACT_STORE" \
            --kroko-work-dir "$KROKO_WORK_DIR" \
            --push-staging \
            --no-manifest \
            --qualification-context "${{ inputs.qualification_context }}"

      - name: Upload Linux candidate artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: candidate-linux
          path: |
            ${{ env.CANDIDATE_DIR }}/build-manifest-*.json
            ${{ env.CANDIDATE_DIR }}/distribution-*.json
            ${{ env.CANDIDATE_DIR }}/staging-*.json
            ${{ env.CANDIDATE_DIR }}/dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------
  # 2. Windows candidate: wheels (win_amd64) on GitHub-hosted Windows runner
  # --------------------------------------------------------------------
  candidate-windows:
    name: Build Windows candidate
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel setuptools

      - name: Record the exact source identity
        id: source
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)" || { echo "checkout is not clean"; exit 1; }

      - name: Build Windows candidate wheels
        run: |
          set -euo pipefail
          python tools/release_candidate.py \
            --out-dir "$CANDIDATE_DIR" \
            --platform windows \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --kroko-artifact-store "$KROKO_ARTIFACT_STORE" \
            --kroko-work-dir "$KROKO_WORK_DIR"

      - name: Upload Windows candidate artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: candidate-windows
          path: |
            ${{ env.CANDIDATE_DIR }}/distribution-*.json
            ${{ env.CANDIDATE_DIR }}/dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------
  # 3. Candidate assembly and qualification
  # --------------------------------------------------------------------
  candidate:
    name: Assemble and qualify candidate
    needs: [candidate-linux, candidate-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Linux candidate artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-linux
          path: ${{ env.CANDIDATE_DIR }}

      - name: Download Windows candidate artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-windows
          path: ${{ env.CANDIDATE_DIR }}

      - name: Record the exact source identity
        id: source
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)" || { echo "checkout is not clean"; exit 1; }

      - name: Assemble the RC manifest
        run: |
          set -euo pipefail
          python release.py manifest build \
            --candidate-dir "$CANDIDATE_DIR" \
            --candidate-id "gh-${{ github.run_id }}-${{ github.run_attempt }}" \
            --source-tree "${{ steps.source.outputs.tree }}" \
            --qualification-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --qualification-context "${{ inputs.qualification_context }}" \
            --qualification-evidence-ref "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --release-readiness NOT_QUALIFIED \
            --out "$CANDIDATE_DIR/rc-manifest.json"

      - name: Validate the RC manifest
        run: python release.py manifest validate "$CANDIDATE_DIR/rc-manifest.json"

      - name: Prove this run performed no public release write
        run: |
          set -euo pipefail
          test -z "$(git tag --points-at HEAD)" || { echo "a git tag was created"; exit 1; }
          python - <<'PYEOF'
          import json, pathlib, os
          manifest = json.loads(pathlib.Path(os.environ["CANDIDATE_DIR"], "rc-manifest.json").read_text())
          for variant, block in manifest["images"].items():
              staging = block["staging"]
              assert "-staging@sha256:" in staging, (variant, staging)
          print("candidate images live only in private staging")
          PYEOF

      - name: Package smoke test across all platform wheels
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import json, os, pathlib, zipfile
          candidate = pathlib.Path(os.environ["CANDIDATE_DIR"])
          manifest = json.loads((candidate / "rc-manifest.json").read_text())
          for variant, block in manifest["distributions"].items():
              assert len(block["wheels"]) >= 2, f"{variant}: expected multi-platform wheels"
              for wheel in block["wheels"]:
                  path = next(candidate.rglob(wheel["filename"]))
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                      embedded = json.loads(archive.read("voice_stt_server/_embedded_kroko.json"))
                  assert any(n.startswith("kroko_onnx/") for n in names), f"{wheel['filename']}: no embedded Kroko runtime"
                  assert any(n.startswith("voice_stt_server/") for n in names), f"{wheel['filename']}: no canonical import package"
                  assert embedded["variant"] == variant, embedded
                  print(f"{variant} ({wheel['platformTag']}): {wheel['filename']} embeds {variant} runtime")
          PYEOF

      - name: Qualify candidate manifest (Option A)
        run: |
          set -euo pipefail
          python release.py manifest qualify \
            --manifest "$CANDIDATE_DIR/rc-manifest.json" \
            --evidence-ref "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --context "${{ inputs.qualification_context }}" \
            --out "$CANDIDATE_DIR/rc-manifest.json"

      - name: Validate qualified RC manifest
        run: python release.py manifest validate "$CANDIDATE_DIR/rc-manifest.json"

      - name: Build final SHA256 inventory
        run: |
          set -euo pipefail
          python -c 'import pathlib; from tools import release_candidate; inv = release_candidate.build_inventory(pathlib.Path(os.environ["CANDIDATE_DIR"])); release_candidate._write_json(pathlib.Path(os.environ["CANDIDATE_DIR"], "sha256-inventory.json"), inv)'

      - name: Verify final SHA256 inventory
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["CANDIDATE_DIR"])
          inventory = json.loads((root / "sha256-inventory.json").read_text())
          for entry in inventory["files"]:
              path = root / entry["path"]
              assert path.is_file(), f"inventory path missing: {entry['path']}"
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              assert len(data) == entry["bytes"], (entry["path"], len(data), entry["bytes"])
              assert actual == entry["sha256"], (entry["path"], actual, entry["sha256"])
          manifest_entry = next((e for e in inventory["files"] if e["path"] == "rc-manifest.json"), None)
          assert manifest_entry is not None, "final inventory must bind rc-manifest.json"
          manifest = json.loads((root / "rc-manifest.json").read_text())
          assert manifest["releaseReadiness"] == "QUALIFIED", manifest["releaseReadiness"]
          print("final inventory matches the QUALIFIED candidate bytes")
          PYEOF

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-candidate-${{ steps.source.outputs.commit }}
          path: |
            ${{ env.CANDIDATE_DIR }}/rc-manifest.json
            ${{ env.CANDIDATE_DIR }}/sha256-inventory.json
            ${{ env.CANDIDATE_DIR }}/build-manifest-*.json
            ${{ env.CANDIDATE_DIR }}/distribution-*.json
            ${{ env.CANDIDATE_DIR }}/staging-*.json
            ${{ env.CANDIDATE_DIR }}/dist/*.whl
          if-no-files-found: error
          retention-days: 90
