name: V1 preservation release publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Run ID that produced v1-release-candidate
        required: true
      version:
        description: V1 preservation version
        required: true
        default: '1.0.0'

permissions: {}
concurrency:
  group: v1-preservation-publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: '1.0.0'
  TAG: v1.0.0
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: read}
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - id: identity
        shell: bash
        env: {INPUT_RUN_ID: '${{ inputs.candidate_run_id }}'}
        run: |
          set -euo pipefail
          test '${{ inputs.version }}' = '1.0.0'
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,pathlib,re
          m=json.loads(pathlib.Path('candidate/rc-manifest.json').read_text())
          assert m['productVersion']=='1.0.0' and m['publicSdist'] is False
          commit=m['sourceCommit']; tree=m['sourceTree']; assert re.fullmatch(r'[0-9a-f]{40}',commit); assert re.fullmatch(r'[0-9a-f]{40}',tree)
          assert m['candidate']['runUrl'].endswith('/actions/runs/'+os.environ['INPUT_RUN_ID'])
          assert commit==os.environ['GITHUB_SHA'], f"publish ref {os.environ['GITHUB_SHA']} != candidate {commit}"
          print('source_commit='+commit); print('source_tree='+tree)
          PY
      - name: Reject a conflicting Git tag before any publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = '${{ steps.identity.outputs.source_tree }}'
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n1 "$TAG")" = '${{ steps.identity.outputs.source_commit }}' || { echo "CONFLICT: $TAG points to another commit" >&2; exit 1; }
          fi
      - name: Classify GitHub Release availability before public writes
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: python tools/v1_release_publish.py release-state --tag "$TAG"

  registry-preflight:
    name: Authenticate and classify registries before PyPI
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {username: '${{ env.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - name: Prove Docker Hub pull/push scope without writing
        env: {DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'}
        run: python tools/v1_dockerhub_scope_check.py
      - name: Read-only candidate and target registry preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py verify-candidate --candidate-dir candidate
          python - <<'PY' > images.tsv
          import json
          m=json.load(open('candidate/rc-manifest.json'))
          for v in ('free','pro'):
            r=m['images'][v]; print(r['image'],r['stagingReference'],r['digest'],sep='\t')
          PY
          while IFS=$'\t' read -r image source expected; do
            python tools/v1_registry_probe.py "$source" "$expected" --require-match
            for registry in "docker.io/${DOCKERHUB_USERNAME}" "ghcr.io/${GITHUB_REPOSITORY_OWNER}"; do
              for tag in 1.0.0 1.0 1 latest; do
                python tools/v1_registry_probe.py "${registry}/${image}:${tag}" "$expected"
              done
            done
          done < images.tsv

  pypi-free:
    name: PyPI Free / first-release setup window
    needs: [preflight, registry-preflight]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, id-token: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - id: state
        name: Classify Free and Pro before writes
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py precheck-pypi --candidate-dir candidate --variant free --stage-dir upload-free --out free-before.json
          python tools/v1_release_publish.py precheck-pypi --candidate-dir candidate --variant pro --stage-dir probe-pro --out pro-before.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib
          f=json.loads(pathlib.Path('free-before.json').read_text()); p=json.loads(pathlib.Path('pro-before.json').read_text())
          fa=all(v=='ABSENT' for v in f['artifacts'].values()); pa=all(v=='ABSENT' for v in p['artifacts'].values())
          print('upload='+('true' if any(v=='ABSENT' for v in f['artifacts'].values()) else 'false'))
          print('bootstrap_probe='+('true' if fa and pa else 'false'))
          PY
      - name: Publish only ABSENT Free wheels
        if: steps.state.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@15c56dba361d8335944d31a2ecd17d700fc7bcbc
        with: {packages-dir: upload-free}
      - name: Verify both Free wheels MATCH
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant free && exit 0; sleep 10; done
          exit 1
      - name: Four-minute Pro publisher setup window after Free verification
        if: steps.state.outputs.bootstrap_probe == 'true'
        shell: bash
        run: |
          echo '::notice title=PyPI Pro setup window::Free wheels MATCH. Configure the Pending Publisher for voice-stt-server-pro now; Pro publication is attempted after 240 seconds.'
          cat <<'EOF'
          PYPI_PRO_PUBLISHER_SETUP_WINDOW: 240 seconds, starting now.
          voice-stt-server 1.0.0 Free Linux+Windows wheels are now remotely verified MATCH.
          Configure the Pending Trusted Publisher for voice-stt-server-pro now:
            repository: marcosudau-vps/voice-stt-server
            workflow: release-publish.yml
            environment: release
          The Pro job will attempt the upload after this pause. If it fails, inspect
          its error, configure/correct the publisher, and re-run with the SAME
          version 1.0.0 and the SAME candidate_run_id; Free MATCH is not re-uploaded.
          EOF
          sleep 240
          echo 'Setup window elapsed; continuing with the Pro publication job.'

  pypi-pro:
    name: PyPI Pro / resumable
    needs: [preflight, pypi-free]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, id-token: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - id: state
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant free
          python tools/v1_release_publish.py precheck-pypi --candidate-dir candidate --variant pro --stage-dir upload-pro --out pro-before.json
          if find upload-pro -maxdepth 1 -type f | grep -q .; then echo upload=true >> "$GITHUB_OUTPUT"; else echo upload=false >> "$GITHUB_OUTPUT"; fi
      - name: Publish only ABSENT Pro wheels
        if: steps.state.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@15c56dba361d8335944d31a2ecd17d700fc7bcbc
        with: {packages-dir: upload-pro}
      - name: Verify all four public Python wheels MATCH
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant pro && break; [ "$i" -eq 12 ] && exit 1; sleep 10; done
          python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant free

  dockerhub:
    needs: [preflight, pypi-pro]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {username: '${{ env.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - name: Promote exact candidate digests to Docker Hub 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > images.tsv
          import json
          m=json.load(open('candidate/rc-manifest.json'))
          for v in ('free','pro'):
            r=m['images'][v]; print(r['image'],r['stagingReference'],r['digest'],sep='\t')
          PY
          while IFS=$'\t' read -r image source expected; do
            python tools/v1_registry_probe.py "$source" "$expected" --require-match
            final="docker.io/${DOCKERHUB_USERNAME}/${image}:1.0.0"
            state="$(python tools/v1_registry_probe.py "$final" "$expected")"
            if [ "$state" = ABSENT ]; then docker buildx imagetools create --tag "$final" "$source"; fi
            python tools/v1_registry_probe.py "$final" "$expected" --require-match
          done < images.tsv

  ghcr:
    needs: [preflight, dockerhub]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, packages: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {username: '${{ env.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Promote same immutable digests to final GHCR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > images.tsv
          import json
          m=json.load(open('candidate/rc-manifest.json'))
          for v in ('free','pro'): r=m['images'][v]; print(r['image'],r['digest'],sep='\t')
          PY
          while IFS=$'\t' read -r image expected; do
            src="docker.io/${DOCKERHUB_USERNAME}/${image}@${expected}"
            python tools/v1_registry_probe.py "$src" "$expected" --require-match
            final="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:1.0.0"
            state="$(python tools/v1_registry_probe.py "$final" "$expected")"
            if [ "$state" = ABSENT ]; then docker buildx imagetools create --tag "$final" "$src"; fi
            python tools/v1_registry_probe.py "$final" "$expected" --require-match
          done < images.tsv

  aliases:
    needs: [preflight, ghcr]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, packages: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {username: '${{ env.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Move aliases only after immutable Free+Pro verification
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py verify-candidate --candidate-dir candidate
          mapfile -t aliases < <(python tools/v1_release_publish.py aliases --version 1.0.0)
          python - <<'PY' > images.tsv
          import json
          m=json.load(open('candidate/rc-manifest.json'))
          for v in ('free','pro'): r=m['images'][v]; print(r['image'],r['digest'],sep='\t')
          PY
          # Detect every conflicting alias before creating the first new one.
          while IFS=$'\t' read -r image digest; do
            for registry in "docker.io/${DOCKERHUB_USERNAME}" "ghcr.io/${GITHUB_REPOSITORY_OWNER}"; do
              python tools/v1_registry_probe.py "${registry}/${image}:1.0.0" "$digest" --require-match
              for alias in "${aliases[@]}"; do
                ref="${registry}/${image}:${alias}"
                python tools/v1_registry_probe.py "$ref" "$digest"
              done
            done
          done < images.tsv
          while IFS=$'\t' read -r image digest; do
            for alias in "${aliases[@]}"; do
              for registry in "docker.io/${DOCKERHUB_USERNAME}" "ghcr.io/${GITHUB_REPOSITORY_OWNER}"; do
                ref="${registry}/${image}:${alias}"
                state="$(python tools/v1_registry_probe.py "$ref" "$digest")"
                if [ "$state" = ABSENT ]; then
                  docker buildx imagetools create --tag "$ref" "${registry}/${image}@${digest}"
                fi
                python tools/v1_registry_probe.py "$ref" "$digest" --require-match
              done
            done
          done < images.tsv

  pre-tag-verify:
    name: Verify PyPI and both registries before Git tag
    needs: [preflight, aliases]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: read, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {username: '${{ env.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Confirm candidate, four PyPI wheels, and all image digests
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py verify-candidate --candidate-dir candidate
          python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant free
          python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant pro
          python - <<'PY' > images.tsv
          import json
          m=json.load(open('candidate/rc-manifest.json'))
          for v in ('free','pro'): r=m['images'][v]; print(r['image'],r['digest'],sep='\t')
          PY
          while IFS=$'\t' read -r image expected; do
            for tag in 1.0.0 1.0 1 latest; do
              for ref in "docker.io/${DOCKERHUB_USERNAME}/${image}:${tag}" "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${tag}"; do
                python tools/v1_registry_probe.py "$ref" "$expected" --require-match
              done
            done
          done < images.tsv

  tag:
    name: Create or verify Git tag after external artifacts match
    needs: [preflight, pre-tag-verify]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}', fetch-depth: 0}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Verify exact candidate and create/resume immutable tag
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py verify-candidate --candidate-dir candidate
          test "$(git rev-parse HEAD)" = '${{ needs.preflight.outputs.source_commit }}'
          test "$(git rev-parse 'HEAD^{tree}')" = '${{ needs.preflight.outputs.source_tree }}'
          git fetch origin --tags --force
          expected='${{ needs.preflight.outputs.source_commit }}'
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n1 "$TAG")" = "$expected" || { echo CONFLICT; exit 1; }
            echo "MATCH: $TAG"
          else
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$expected" -m 'VoiceSTT V1 preservation release 1.0.0'
            git push origin "refs/tags/$TAG"
          fi

  github-release:
    name: GitHub Release last + final verification
    needs: [preflight, tag]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {actions: read, contents: write, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ needs.preflight.outputs.source_commit }}'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: {name: v1-release-candidate, path: candidate, run-id: '${{ inputs.candidate_run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Create/resume release from exact hashed assets
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1_release_publish.py verify-candidate --candidate-dir candidate
          mapfile -t wheels < <(find candidate/python -name '*.whl' -type f | sort)
          test "${#wheels[@]}" -eq 4
          assets=("${wheels[@]}" candidate/rc-manifest.json candidate/sha256-inventory.json)
          expected='${{ needs.preflight.outputs.source_commit }}'
          git fetch origin --tags
          test "$(git rev-list -n1 "$TAG")" = "$expected" || { echo 'CONFLICT: Git tag points to another commit'; exit 1; }
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          release_state="$(python tools/v1_release_publish.py release-state --tag "$TAG")"
          if [ "$release_state" = MATCH ]; then
            echo "MATCH/RESUME: release exists; checking each existing asset before upload"
            existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for f in "${assets[@]}"; do
              name="$(basename "$f")"
              if grep -Fxq "$name" <<< "$existing_assets"; then
                gh release download "$TAG" --pattern "$name" --dir "$verify_dir"
                cmp -s "$f" "$verify_dir/$name" || { echo "CONFLICT: release asset differs: $name"; exit 1; }
              fi
            done
            for f in "${assets[@]}"; do
              name="$(basename "$f")"
              if ! grep -Fxq "$name" <<< "$existing_assets"; then
                gh release upload "$TAG" "$f"
              fi
            done
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title 'VoiceSTT V1.0.0 preservation release' --notes 'Preserved V1 release: Free and Pro CPython 3.12 native wheels for Linux x86_64 and Windows AMD64; exact qualified OCI images.'
          fi
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            if [ ! -f "$verify_dir/$name" ]; then
              gh release download "$TAG" --pattern "$name" --dir "$verify_dir"
            fi
            cmp -s "$f" "$verify_dir/$name" || { echo "CONFLICT: release asset differs: $name"; exit 1; }
          done
          python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant free
          python tools/v1_release_publish.py verify-pypi --candidate-dir candidate --variant pro
