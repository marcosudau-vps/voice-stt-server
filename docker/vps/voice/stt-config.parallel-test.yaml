version: 1

# Isoliertes CPU-Profil für den realen Paralleltest mit zwei verschiedenen
# lokalen Modellen. Dieser Container wird nicht veröffentlicht.
settings:
  host: 0.0.0.0
  port: 8010
  log_level: INFO
  language: de
  device: cpu
  compute_type: int8

  transcription_engine: kroko_onnx
  model: Kroko-DE-Community-64-L-Streaming-001.data
  realtime_transcription_engine: kroko_onnx
  realtime_model: Kroko-DE-Community-128-L-Streaming-001.data
  use_main_model_for_realtime: false

  wakeword_backend: ""
  wake_words: ""
  model_warmup: false
  model_idle_unload_enabled: false
  model_memory_policy_enabled: true
  allow_two_medium_models: true
  max_sessions: 4
  max_active_speakers: 2

  openai_api_enabled: true
  openai_model_aliases:
    whisper-1: final
    fast: realtime

  request_logging_enabled: false
  performance_logging_enabled: true
  performance_log_stdout: true
  performance_log_path: /tmp/voicestt-performance.jsonl
  runtime_config_path: /tmp/runtime.json
