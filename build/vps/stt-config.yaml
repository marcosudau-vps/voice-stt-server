version: 1

# Secrets are intentionally forbidden here. API/Admin keys and the Kroko Pro
# license key are injected from /home/marco/selfhost/secrets/*.env by Compose.
settings:
  host: 0.0.0.0
  port: 8010
  log_level: INFO
  language: de
  device: cpu
  compute_type: int8

  # Two licensed recognizers caused a native exit 139 with the tested runtime.
  # Share the low-latency Pro-16 model between final and realtime jobs.
  transcription_engine: kroko_onnx
  model: Kroko-DE-Pro-16-L-Streaming-001.data
  realtime_transcription_engine: kroko_onnx
  realtime_model: Kroko-DE-Pro-16-L-Streaming-001.data
  use_main_model_for_realtime: true
  transcription_engine_options:
    decoding_method: modified_beam_search
    max_active_paths: 16
    blank_penalty: 4.0
    rule1_min_trailing_silence: 6.0
    rule2_min_trailing_silence: 3.6
    rule3_min_utterance_length: 40.0
  realtime_transcription_engine_options:
    decoding_method: modified_beam_search
    max_active_paths: 16
    blank_penalty: 4.0
    rule1_min_trailing_silence: 6.0
    rule2_min_trailing_silence: 3.6
    rule3_min_utterance_length: 40.0

  tuning_profile: custom
  beam_size: 5
  beam_size_realtime: 3
  batch_size: 16
  realtime_batch_size: 16
  vad_filter: true
  normalize_audio: false
  realtime_callback: update
  min_length_of_recording: 0.2
  min_gap_between_recordings: 0.0
  post_speech_silence_duration: 2.4
  silero_sensitivity: 0.05
  webrtc_sensitivity: 3
  realtime_processing_pause: 0.02
  realtime_transcription_use_syllable_boundaries: false
  realtime_boundary_detector_sensitivity: 0.6
  realtime_boundary_followup_delays: [0.05, 0.2]
  early_transcription_on_silence: 1.0

  wakeword_backend: openwakeword
  wake_words: hey_jarvis
  openwakeword_model_paths: /models/openwakeword/resources/models/all_models/models.json
  openwakeword_inference_framework: onnx
  wake_words_sensitivity: 0.5
  wake_word_activation_delay: 0.0
  wake_word_timeout: 7.0
  wake_word_buffer_duration: 0.1
  wake_word_followup_window: 7.0

  max_sessions: 8
  max_active_speakers: 4
  audio_queue_size: 128
  max_audio_packet_bytes: 524288
  max_audio_queue_seconds_per_session: 30.0
  pre_recording_buffer_duration: 0.75
  max_realtime_queue_age_ms: 1500
  max_final_queue_depth_per_session: 8
  max_global_inference_queue_depth: 64
  realtime_degradation_threshold_ms: 1500
  realtime_min_audio_seconds: 0.25
  realtime_max_audio_seconds: 20.0
  vad_energy_threshold: 250.0

  model_warmup: false
  model_idle_unload_enabled: true
  model_idle_timeout_seconds: 3600.0
  model_memory_policy_enabled: true
  allow_two_medium_models: true

  openai_api_enabled: true
  openai_model_aliases:
    whisper-1: final
    fast: realtime
  openai_max_file_bytes: 26214400

  data_root_path: /data
  request_logging_enabled: true
  request_log_stdout: true
  request_log_transcripts: true
  request_log_max_bytes: 10485760
  request_log_backup_count: 12
  performance_logging_enabled: true
  performance_log_stdout: true
  performance_log_max_bytes: 10485760
  performance_log_backup_count: 12
  save_audio_files: false
