services:
  server:
    build:
      context: .
      target: cpu
      args:
        KROKO_VARIANT: ${VOICESTT_KROKO_VARIANT:-free}
    image: ${VOICESTT_IMAGE:?Starte Compose über tools/compose.py}
    container_name: voicestt-server
    restart: unless-stopped
    init: true
    environment:
      VOICESTT_CPU_ONLY: "1"
      VOICESTT_OFFLINE_MODELS: "1"
      VOICESTT_FASTER_WHISPER_MODEL_ROOT: /models/ctranslate2
      VOICESTT_KROKO_MODEL_ROOT: /models/kroko
      VOICESTT_OPENWAKEWORD_MODEL_ROOT: /models/openwakeword
      VOICESTT_API_KEY: ${VOICESTT_API_KEY:-}
      VOICESTT_ADMIN_API_KEY: ${VOICESTT_ADMIN_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: ${VOICESTT_CPU_THREADS:?Starte Compose über tools/compose.py}
      CT2_USE_EXPERIMENTAL_PACKED_GEMM: "1"
    command:
      - python
      - -m
      - VoiceSTT_server.server
      - --config
      - /config/config.yaml
    volumes:
      - type: bind
        source: ./config.yaml
        target: /config/config.yaml
        read_only: true
      - type: bind
        source: ${VOICESTT_FASTER_WHISPER_HOST_PATH:?Starte Compose über tools/compose.py}
        target: /models/ctranslate2
        read_only: true
      - type: bind
        source: ${VOICESTT_KROKO_HOST_PATH:?Starte Compose über tools/compose.py}
        target: /models/kroko
        read_only: true
      - type: bind
        source: ${VOICESTT_OPENWAKEWORD_HOST_PATH:?Starte Compose über tools/compose.py}
        target: /models/openwakeword
        read_only: true
      - type: bind
        source: ${VOICESTT_DATA_PATH:?Starte Compose über tools/compose.py}
        target: /data
    ports:
      - "${VOICESTT_PORT:?Starte Compose über tools/compose.py}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; result=json.load(urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)); assert result.get('ready') and result.get('ok')"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  browserclient:
    image: nginx:1.29-alpine
    container_name: voicestt-browserclient
    restart: unless-stopped
    volumes:
      - ./api_fastapi_server/static:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${VOICESTT_BROWSER_PORT:?Starte Compose über tools/compose.py}:80"
    depends_on:
      server:
        condition: service_healthy
